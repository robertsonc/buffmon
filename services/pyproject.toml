[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "buffmon"
version = "0.1.0"
description = "buffmon ingest service, live hub and dashboard (Phase 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "websockets==17.4",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261030",
]
# Embedded ClickHouse engine used by the storage integration test. The CI image
# may not be allowed to run a ClickHouse server; chdb runs the same SQL in-process.
integration = [
    "chdb==4.4.0",
]

[project.scripts]
buffmon-ingest = "buffmon.__main__:main"
buffmon-mint-token = "buffmon.tools.mint_token:main"
buffmon-simulate = "buffmon.tools.simulate:main"
buffmon-flows = "buffmon.flows.consumer:main"
buffmon-orch-discover = "buffmon.orch.swagger:main"
buffmon-orch-poll = "buffmon.orch.poller:main"

[tool.setuptools.packages.find]
include = ["buffmon*"]

[tool.setuptools.package-data]
buffmon = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "PTH", "LOG", "G"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "PTH"]
"buffmon/tools/simulate.py" = ["S311"]  # simulator randomness is not security-relevant

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chdb", "chdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
