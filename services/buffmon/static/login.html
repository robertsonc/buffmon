<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>buffmon sign in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7a75'/%3E%3Cpath d='M5 19h5l3-9 5 14 3-8h6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login" method="post" action="/login">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M1.5 9.5h2.6l1.6-4.6 2.6 7.2 1.6-4h4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <h1>buffmon</h1>
      <p>Live network experience monitoring</p>
      <label for="token">Dashboard token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
      <div class="err" id="err" hidden>That token was not accepted.</div>
      <div class="hint">Tokens are issued with <span class="mono">buffmon-mint-token ui</span>.</div>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
